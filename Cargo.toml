[package]
name = "boslook"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["getrandom"] }
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
getrandom = "0.4.3"
hound = "3.5.1"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "io-std", "io-util", "time"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.8"
webpki-roots = "1.0.10"
