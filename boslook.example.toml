# BosLook – Beispielkonfiguration. Kopieren nach boslook.toml und anpassen.

# Datenbank für Telegramme und Beschreibungen: Dateiname für SQLite oder eine Adresse für
# MySQL/MariaDB bzw. PostgreSQL (Datenbank und Benutzer vorher anlegen, die Tabellen legt
# BosLook selbst an), z. B. "mysql://boslook:passwort@localhost/boslook" oder
# "postgres://boslook:passwort@localhost/boslook"
database = "boslook.db"

# Gleiche Telegramme (Alarme werden oft wiederholt) innerhalb dieser Sekunden nur einmal
# benachrichtigen, 0 = jedes Mal
# notify_repeat = 60

[web]
listen = "0.0.0.0:8443"
# "off" = HTTP, "self-signed" = Zertifikat wird beim ersten Start erstellt,
# "files" = eigenes Zertifikat (z. B. von Let's Encrypt) aus cert/key laden
tls = "self-signed"
cert = "boslook-cert.pem"
key = "boslook-key.pem"

# Wetterwarnungen des DWD, erscheinen im Reiter "Wetter" und können mit kind = "wetter"
# in Filtern und Alarmregeln verwendet werden (sub = Warnstufe, z. B. sub = "[45]" für
# Unwetter und extremes Unwetter). Warncell-ID suchen mit: boslook warncell Leipzig
[weather]
warncells = ["114713000"]
interval = 300            # Abfrage alle 300 Sekunden

# Benutzer für die Weboberfläche. Hash erzeugen mit: boslook hash-password
[[user]]
name = "admin"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$ERSETZEN$ERSETZEN"

# Clients, die Telegramme an diesen Server weiterleiten. Am einfachsten nur den Namen
# eintragen und auf der Seite "Clients" einen Einrichtungscode erzeugen (boslook setup <code>).
# Von Hand: Token frei wählen (lang und zufällig), Hash erzeugen mit: boslook hash-password
[[client]]
name = "Zuhause"
token_hash = "$argon2id$v=19$m=19456,t=2,p=1$ERSETZEN$ERSETZEN"
# Fernkonfiguration: Der Client nimmt diese Eingänge statt seiner eigenen
# remote = true
# [[client.input]]
# name = "Funk"
# type = "rtl_fm"
# frequency = "173.255M"
# ppm = 42

# Eingänge. Dekoder: pocsag512, pocsag1200, fms, zvei (Standard: alle)
# pocsag: Darstellung der POCSAG-Meldungen: "alpha" (Standard, immer Text),
#         "numeric" (immer Ziffern) oder "auto" (Sub a als Ziffern, sonst Text)
[[input]]
name = "Testaufnahme"
type = "wav"
path = "test-wav/Leipsch_viel_cutted.wav"

# Soundkarte, Gerät wie von "boslook devices" angezeigt (ohne device: Standardgerät)
# [[input]]
# name = "Funkscanner"
# type = "soundcard"
# device = "alsa:plughw:CARD=Device,DEV=0"

# RTL-SDR-Stick: BosLook startet rtl_fm selbst (Linux: apt install rtl-sdr)
# [[input]]
# name = "Funk"
# type = "rtl_fm"
# frequency = "173.255M"
# ppm = 0                 # Frequenzkorrektur des Sticks
# gain = "auto"           # oder z. B. "38.6" (dB)
# device = "0"            # Index oder Seriennummer des Sticks
# squelch = 0             # 0 = aus (für Dekoder empfohlen)

# Mehrere Frequenzen gleichzeitig mit einem Stick (innerhalb von 1 MHz), über rtl_sdr und den
# eigenen Demodulator. Jeder Kanal erscheint als eigener Reiter.
# [[input]]
# name = "Stick"
# type = "rtl_sdr"
# ppm = 0
# gain = "auto"
# [[input.channel]]
# name = "POCSAG Kreis"
# frequency = "173.255M"
# [[input.channel]]
# name = "FMS"
# frequency = "172.890M"

# Live-Audio von stdin (signed 16 Bit, mono), z. B.:
#   rtl_fm -f 173.255M -M fm -s 22050 - | boslook serve
#   arecord -f S16_LE -r 22050 -c 1 | boslook serve
[[input]]
name = "SDR"
type = "stdin"
sample_rate = 22050
decoders = ["pocsag512", "pocsag1200"]
pocsag = "auto"

# Bearbeitungsregeln: ändern Telegramme, bevor gefiltert und gespeichert wird. Bedingung wie
# bei Filtern, alle passenden Regeln nacheinander; stop = true beendet nach dieser Regel.
# [[rewrite]]
# name = "Stichwort ausschreiben"
# address = "^18599"
# address_add = 1000          # RIC um 1000 erhöhen (nur POCSAG), negativ = verringern
#
# [[rewrite.replace]]         # Ersetzungen in der Meldung, nacheinander
# pattern = "^F(\\d)\\b"
# with = "Feuer $1"           # $1, $2 … = Klammern aus pattern

# Filter (reguläre Ausdrücke). Ohne Filter wird alles angezeigt.
# Ein Filter mit source gilt nur für diesen Kanal, einer ohne source für alle Kanäle.
# Gelten für einen Kanal Filter ohne "exclude", muss mindestens einer passen.
# Felder: kind (pocsag/fms/zvei/wetter), source (Kanal = Name des Eingangs), address, sub,
# message und aus den Beschreibungen ort, kurz, lang
[[filter]]
name = "Eigene Schleifen"
kind = "pocsag"
address = "^18599"

[[filter]]
name = "Probealarme ausblenden"
message = "(?i)probealarm"
exclude = true

# Benachrichtigungsziele. Testen mit: boslook test-notify
[[notifier]]
name = "Handy"
type = "pushover"
token = "ERSETZEN"      # API-Token der Pushover-Anwendung
user = "ERSETZEN"       # User- oder Gruppen-Key

[[notifier]]
name = "Leitstelle"
type = "telegram"
bot_token = "ERSETZEN"  # von @BotFather
chat_id = "ERSETZEN"    # Chat- oder Gruppen-ID

[[notifier]]
name = "Mail"
type = "email"
server = "smtp.example.org"
security = "starttls"   # "starttls" (Port 587), "tls" (Port 465) oder "none" (Port 25)
username = "boslook@example.org"
password = "ERSETZEN"
from = "BosLook <boslook@example.org>"
to = ["ich@example.org"]

# Alarmregeln: Felder wie bei den Filtern, notify = Namen der Ziele.
# priority (nur Pushover): "normal" (Standard), "high" (Ton auch bei „Nicht stören")
# oder "emergency" (wird wiederholt, bis die Nachricht bestätigt ist)
# title und text sind Vorlagen mit Platzhaltern: {kind} {address} {sub} {message} {ort}
# {kurz} {lang} {source} {time} {alarm}. Ohne Vorlage: Name der Regel bzw. Standardtext.
[[alarm]]
name = "Eigene Schleife"
kind = "pocsag"
address = "^18599"
notify = ["Handy", "Leitstelle"]
priority = "high"
# title = "{kurz}"
# text = "{ort}: {message} ({time})"

# Plugins: Ordner unter plugins/ neben dieser Datei, Abschnitt = eingeschaltet.
# Doku: docs/index.md. Ein Plugin mit Benachrichtigungsart ist ein weiterer
# Dienst unter [[notifier]], z. B. type = "webhook".
# [plugin.webhook]
# timeout = 10
