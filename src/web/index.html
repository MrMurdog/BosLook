<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BosLook</title>
<link rel="icon" href="/icon.svg">
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --text: #1d2330; --muted: #6b7385; --line: #e2e5ea;
    --accent: #005795; --danger: #dd3127; --pocsag: #dd3127; --fms: #1565c0; --zvei: #2e7d32; --wetter: #ef6c00; --new: #fff6d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b1f27; --text: #e6e8ec; --muted: #8b93a5; --line: #2b313c;
      --accent: #4a9be0; --danger: #ef5350; --pocsag: #ef5350; --fms: #64b5f6; --zvei: #81c784; --wetter: #ffb74d; --new: #3a3420;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; } header h1 span { color: var(--accent); }
  #version { color: var(--muted); font-size: 12px; }
  #actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  #menu-btn, .narrow { display: none; }
  #status { margin-left: auto; color: var(--muted); font-size: 13px; }
  #status.on::before { content: "●"; color: #43a047; margin-right: 4px; }
  #status.off::before { content: "●"; color: var(--danger); margin-right: 4px; }
  button, .button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 16px; }
  #tabs { display: flex; gap: 4px; overflow-x: auto; }
  #tabs button { border-radius: 8px 8px 0 0; border-bottom: none; white-space: nowrap; color: var(--muted); }
  #tabs button.active { color: var(--text); font-weight: 600; border-color: var(--accent); border-bottom: 2px solid var(--accent); }
  #tabs button.dragging { opacity: 0.4; }
  #tabs .count { margin-left: 6px; padding: 0 6px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 0 8px 8px 8px; overflow: hidden; }
  .table { max-height: calc(100vh - 150px); overflow: auto; }
  /* Meldung bekommt den Rest, mindestens 16rem (min-width setzt columns()); sonst scrollt die Tabelle waagerecht */
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; overflow: hidden; box-sizing: border-box; }
  th { font-size: 12px; text-transform: uppercase; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
  th .grip { position: absolute; top: 0; right: 0; bottom: 0; width: 7px; cursor: col-resize; border-right: 1px solid var(--line); touch-action: none; }
  #empty { color: var(--muted); }
  td.time { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
  td.addr { font-family: ui-monospace, monospace; white-space: nowrap; }
  td.msg, td.text { word-break: break-word; }
  th[draggable] { cursor: grab; }
  .menu { position: relative; }
  .menu summary { list-style: none; } .menu summary::-webkit-details-marker { display: none; }
  .menu > div { position: absolute; right: 0; z-index: 2; min-width: 14rem; margin-top: 4px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px #0003; white-space: nowrap; }
  .menu h2 { margin: 6px 0 4px; font-size: 11px; text-transform: uppercase; color: var(--muted); }
  .menu .col { display: flex; align-items: center; gap: 4px; padding: 2px 0; }
  .menu .col label { flex: 1; }
  .menu .col button { padding: 0 6px; }
  .menu .col button:disabled { opacity: 0.3; cursor: default; }
  .menu .entry { display: block; width: 100%; margin: 2px 0; padding: 4px 6px; border: none; text-align: left; }
  .menu .entry:hover { background: var(--bg); }
  a.entry { color: var(--text); text-decoration: none; box-sizing: border-box; }
  .menu p { margin: 4px 6px 8px; white-space: normal; max-width: 20rem; }
  #update summary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  #update-msg.err { color: var(--danger); }
  /* Schmale Bildschirme: alles rechts vom Status hinter ☰ */
  @media (max-width: 720px) {
    #menu-btn, .narrow { display: inline; }
    #actions { display: none; width: 100%; flex-direction: column; align-items: stretch; gap: 6px; text-align: left; }
    #actions > button { text-align: left; }
    header.open #actions { display: flex; }
    .menu > div { position: static; box-shadow: none; }
  }
  .kind { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; color: #fff; }
  .kind.pocsag { background: var(--pocsag); } .kind.fms { background: var(--fms); } .kind.zvei { background: var(--zvei); } .kind.wetter { background: var(--wetter); }
  tr.new { background: var(--new); transition: background 3s; }
  .more { margin: 12px auto; display: block; }
  #login { max-width: 320px; margin: 15vh auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 24px; }
  /* Der Schriftzug im Banner ist hellgrau und braucht einen dunklen Hintergrund */
  #login .banner { display: block; width: 100%; margin: 0 0 16px; padding: 14px 18px; border-radius: 8px; background: #1b1f27; }
  #login label { display: block; margin: 10px 0 4px; color: var(--muted); }
  #login input { width: 100%; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  #login button { width: 100%; margin-top: 16px; }
  #error { color: var(--danger); min-height: 1.4em; margin-top: 8px; }
  #settings textarea { width: 100%; height: calc(100vh - 190px); font: 13px/1.4 ui-monospace, monospace; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); resize: vertical; }
  #settings .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
  #settings-msg { white-space: pre-wrap; font-size: 13px; }
  #settings-msg.err { color: var(--danger); font-family: ui-monospace, monospace; }
  #cfg-form .section { margin: 0 0 14px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  #cfg-form .section > summary { font-weight: 600; cursor: pointer; }
  #cfg-form .section[open] > summary { margin-bottom: 8px; }
  #cfg-form .help { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
  #cfg-form .item { border-top: 1px solid var(--line); padding: 10px 0; }
  #cfg-form .row { display: grid; grid-template-columns: 14rem minmax(0, 32rem); gap: 4px 12px; align-items: start; margin: 6px 0; }
  #cfg-form .row > span:first-child { padding-top: 7px; }
  #cfg-form .row small { grid-column: 2; color: var(--muted); font-size: 12px; }
  /* Einträge einer Gruppe (z. B. Kanäle eines Plugins) */
  #cfg-form .row .item { border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px 8px; margin-bottom: 8px; }
  #cfg-form .row .row { grid-template-columns: 9rem minmax(0, 1fr); }
  #cfg-form input:not([type=checkbox]), #cfg-form select, #cfg-form textarea { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  #cfg-form textarea { height: auto; resize: vertical; }
  #cfg-form .pair { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; margin-bottom: 6px; }
  #cfg-form .pair input { font-family: ui-monospace, monospace; }
  #cfg-form .test { display: grid; grid-template-columns: 7rem 1fr 4rem; gap: 6px; }
  #cfg-form .test .message, #cfg-form .test .source { grid-column: 1 / -1; }
  #cfg-form .test-result { grid-column: 2; white-space: pre-wrap; font-size: 13px; }
  #cfg-form .test-result.err { color: var(--danger); }
  #cfg-form .checks { display: flex; flex-wrap: wrap; gap: 4px 14px; padding-top: 6px; }
  #cfg-form .req { color: var(--danger); }
  @media (max-width: 640px) { #cfg-form .row, #cfg-form .row .row { grid-template-columns: 1fr; } #cfg-form .row small { grid-column: 1; } #cfg-form .row > span:first-child { padding-top: 0; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<form id="login" hidden>
  <img class="banner" src="/banner.svg" alt="BosLook">
  <label for="user">Benutzer</label><input id="user" autocomplete="username" required>
  <label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" required>
  <button class="primary">Anmelden</button>
  <div id="error"></div>
</form>

<div id="app" hidden>
  <header>
    <h1>Bos<span>Look</span></h1>
    <span id="version"></span>
    <span id="status" class="off">getrennt</span>
    <button id="menu-btn" title="Menü">☰</button>
    <nav id="actions">
      <details id="update" class="menu" hidden><summary class="button">Update ▾</summary><div>
        <p id="update-text"></p>
        <a id="update-notes" class="entry" target="_blank" rel="noopener">Änderungen ansehen</a>
        <button id="update-install" class="entry">Jetzt aktualisieren</button>
        <button id="update-check" class="entry">Erneut suchen</button>
        <p id="update-msg"></p>
      </div></details>
      <details id="view" class="menu"><summary class="button">Ansicht ▾</summary><div>
        <h2>Spalten</h2>
        <div id="columns"></div>
        <button id="columns-reset" class="entry">Spalten zurücksetzen</button>
        <h2>Reiter</h2>
        <div id="tab-list"></div>
        <button id="tabs-sort" class="entry">Reiter A–Z sortieren</button>
      </div></details>
      <details id="plugins" class="menu"><summary class="button">Plugins ▾</summary><div id="plugin-list"></div></details>
      <button id="descriptions-btn">Beschreibungen</button>
      <button id="clients-btn">Clients</button>
      <button id="settings-btn" title="Einstellungen">⚙<span class="narrow"> Einstellungen</span></button>
      <button id="logout">Abmelden</button>
    </nav>
  </header>
  <main id="settings" hidden>
    <div class="bar">
      <button id="settings-back">Zurück</button>
      <button id="save" class="primary">Speichern</button>
      <button id="save-restart">Speichern und neu starten</button>
      <button id="mode">Als Text bearbeiten</button>
      <span id="settings-msg"></span>
    </div>
    <form id="cfg-form" autocomplete="off"></form>
    <textarea id="config" spellcheck="false" hidden></textarea>
  </main>
  <main id="telegrams">
    <p id="empty">Noch keine Quellen vorhanden.</p>
    <nav id="tabs"></nav>
    <div id="panels"></div>
  </main>
</div>

<template id="panel">
  <section class="panel" hidden>
    <div class="table">
      <table>
        <thead><tr></tr></thead>
        <tbody></tbody>
      </table>
      <button class="more">Ältere laden</button>
    </div>
  </section>
</template>

<script>
const $ = (id) => document.getElementById(id);
let socket = null;
// Quelle -> { rows, more, oldest, el, tab, unread }
let panels = new Map();
let active = null;
let wanted = null;

// Reihenfolge und gewählter Reiter gelten nur für diesen Browser
function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

// Spalten der Tabelle; die Meldung bekommt die restliche Breite
const COLUMNS = [
  { key: "time", label: "Zeit", cls: "time", width: "11.5rem" },
  { key: "kind", label: "Art", width: "5rem" },
  { key: "address", label: "Adresse", cls: "addr", width: "6rem" },
  { key: "sub", label: "Sub", cls: "addr", width: "3.5rem" },
  { key: "message", label: "Meldung", cls: "msg" },
  { key: "ort", label: "Ort", cls: "text", width: "10rem" },
  { key: "kurz", label: "Kurzbeschreibung", cls: "text", width: "10rem" },
  { key: "lang", label: "Langbeschreibung", cls: "text", width: "14rem" },
];
// Welche Spalten sichtbar sind und ihre Reihenfolge, gilt für alle Reiter in diesem Browser
let hidden = load("boslook.hidden", []);
let order = load("boslook.order", []);
// Spalten ohne gespeicherte Position (z. B. nach einem Update neue) kommen ans Ende
const rank = (c) => { const i = order.indexOf(c.key); return i < 0 ? order.length + COLUMNS.indexOf(c) : i; };
const ordered = () => [...COLUMNS].sort((a, b) => rank(a) - rank(b));
const visible = () => ordered().filter((c) => !hidden.includes(c.key));

function row(t, isNew) {
  const tr = document.createElement("tr");
  tr.telegram = t;
  if (isNew) { tr.className = "new"; setTimeout(() => tr.classList.remove("new"), 50); }
  for (const c of visible()) {
    const td = document.createElement("td");
    td.className = c.cls ?? "";
    if (c.key === "kind") {
      const b = document.createElement("span");
      b.className = "kind " + t.kind;
      b.textContent = t.kind.toUpperCase();
      td.append(b);
    } else td.textContent = c.key === "time" ? new Date(t.time).toLocaleString("de-DE") : t[c.key] ?? "";
    tr.append(td);
  }
  return tr;
}

// Kopfzeile aller Tabellen neu aufbauen und vorhandene Zeilen neu zeichnen
function columns() {
  for (const p of panels.values()) {
    const head = p.el.querySelector("thead tr");
    head.innerHTML = "";
    for (const c of visible()) {
      const th = document.createElement("th");
      th.textContent = c.label;
      th.draggable = true; th.dataset.col = c.key;
      if (c.width) {
        th.style.width = widths[c.key] ? widths[c.key] + "px" : c.width;
        const grip = document.createElement("span");
        grip.className = "grip"; grip.dataset.col = c.key;
        th.append(grip);
      }
      head.append(th);
    }
    for (const tr of [...p.rows.children]) tr.replaceWith(row(tr.telegram, false));
  }
  applyWidths();
}

// Spalte `key` vor die Spalte `before` setzen (null = ans Ende)
function moveColumn(key, before) {
  const keys = ordered().map((c) => c.key).filter((k) => k !== key);
  keys.splice(before ? keys.indexOf(before) : keys.length, 0, key);
  order = keys;
  save("boslook.order", order);
  columns();
  columnMenu();
}

// Spalten im Menü „Ansicht“: ein-/ausblenden, mit ▲/▼ verschieben (auch per Touch)
function columnMenu() {
  const list = ordered();
  $("columns").replaceChildren(...list.map((c, i) => {
    const box = el("input"); box.type = "checkbox"; box.checked = !hidden.includes(c.key);
    box.onchange = () => {
      hidden = box.checked ? hidden.filter((k) => k !== c.key) : [...hidden, c.key];
      save("boslook.hidden", hidden);
      columns();
    };
    const label = el("label"); label.append(box, " " + c.label);
    const up = el("button", "", "▲"); up.title = "Nach vorn"; up.disabled = i === 0;
    up.onclick = () => moveColumn(c.key, list[i - 1].key);
    const down = el("button", "", "▼"); down.title = "Nach hinten"; down.disabled = i === list.length - 1;
    down.onclick = () => moveColumn(c.key, list[i + 2]?.key ?? null);
    const line = el("div", "col"); line.append(label, up, down);
    return line;
  }));
}
columnMenu();
$("columns-reset").onclick = () => {
  hidden = []; order = [];
  for (const k of Object.keys(widths)) delete widths[k];
  save("boslook.hidden", []); save("boslook.order", []); save("boslook.widths", {});
  columns();
  columnMenu();
};

// Offene Menüs schließen sich beim Klick daneben
document.addEventListener("click", (e) => {
  for (const m of document.querySelectorAll(".menu")) if (!m.contains(e.target)) m.open = false;
});
$("menu-btn").onclick = () => document.querySelector("header").classList.toggle("open");
$("descriptions-btn").onclick = () => window.open("/beschreibungen", "_blank");
$("clients-btn").onclick = () => window.open("/clients", "_blank");

// Hinweis auf eine neuere Version; einspielen nur auf Knopfdruck
function showUpdate({ current, state }) {
  const r = state.available;
  $("update").hidden = !r;
  if (!r) return;
  $("update").querySelector("summary").textContent = `Update ${r.version} ▾`;
  $("update-text").textContent = `BosLook ${r.version}${r.prerelease ? " (Vorabversion)" : ""} ist verfügbar, installiert ist ${current}.`;
  $("update-notes").href = r.url;
}
async function loadUpdate() {
  const res = await fetch("/api/update");
  if (res.ok) showUpdate(await res.json());
}
$("update-check").onclick = async () => {
  $("update-msg").textContent = "Suche …"; $("update-msg").className = "";
  const res = await fetch("/api/update/check", { method: "POST" });
  if (!res.ok) return;
  const data = await res.json();
  showUpdate(data);
  $("update-msg").textContent = data.state.error ?? (data.state.available ? "" : "BosLook ist aktuell.");
  $("update-msg").className = data.state.error ? "err" : "";
};
$("update-install").onclick = async () => {
  if (!confirm("Update jetzt einspielen? BosLook startet danach neu; währenddessen werden keine Telegramme empfangen.")) return;
  $("update-msg").textContent = "Lade und prüfe das Update …"; $("update-msg").className = "";
  const res = await fetch("/api/update/install", { method: "POST" });
  if (!res.ok) { $("update-msg").textContent = await res.text(); $("update-msg").className = "err"; return; }
  $("update-msg").textContent = "Eingespielt, BosLook startet neu …";
  setTimeout(() => location.reload(), 4000);
};

// Menü „Plugins“: Übersicht und je Plugin mit eigener Seite ein Eintrag
async function pluginPages() {
  const entry = (text, title, url) => {
    const b = el("button", "entry", text);
    b.title = title;
    b.onclick = () => { $("plugins").open = false; window.open(url, "_blank"); };
    return b;
  };
  const overview = entry("Übersicht", "Alle installierten Plugins", "/plugins");
  $("plugin-list").replaceChildren(overview);
  const res = await fetch("/api/plugins");
  if (!res.ok) return;
  const pages = (await res.json()).plugins.filter((p) => p.page);
  $("plugin-list").append(...pages.map((p) => entry(p.name, p.description, `/plugins/${p.name}/`)));
}

function panel(source) {
  if (panels.has(source)) return panels.get(source);
  const el = $("panel").content.firstElementChild.cloneNode(true);
  const tab = document.createElement("button");
  tab.draggable = true;
  tab.dataset.source = source;
  tab.hidden = hiddenTabs.includes(source);
  tab.append(source);
  const p = { rows: el.querySelector("tbody"), more: el.querySelector(".more"), oldest: null, el, tab, unread: 0 };
  p.more.onclick = () => loadOlder(source);
  tab.onclick = () => select(source);
  tab.ondragstart = (e) => {
    e.dataTransfer.setData("text/plain", source);
    tab.classList.add("dragging");
  };
  tab.ondragend = () => {
    tab.classList.remove("dragging");
    save("boslook.tabs", [...$("tabs").children].map((t) => t.dataset.source));
    tabMenu();
  };
  panels.set(source, p);
  $("empty").hidden = true;
  $("panels").append(el);
  columns();
  const next = [...$("tabs").children].find((t) => tabOrder(source, t.dataset.source) < 0);
  $("tabs").insertBefore(tab, next ?? null);
  if (!tab.hidden && (!active || panels.get(active).tab.hidden || source === wanted)) select(source);
  tabMenu();
  return p;
}

// Reiter im Menü „Ansicht“: ausblenden gilt nur für diesen Browser, löschen entfernt die
// Telegramme des Reiters aus der Datenbank
let hiddenTabs = load("boslook.hiddenTabs", []);
function tabMenu() {
  const sources = [...$("tabs").children].map((t) => t.dataset.source);
  $("tab-list").replaceChildren(...sources.map((source) => {
    const box = el("input"); box.type = "checkbox"; box.checked = !hiddenTabs.includes(source);
    box.onchange = () => {
      hiddenTabs = box.checked ? hiddenTabs.filter((s) => s !== source) : [...hiddenTabs, source];
      save("boslook.hiddenTabs", hiddenTabs);
      panels.get(source).tab.hidden = !box.checked;
      if (box.checked && !active) select(source);
      if (!box.checked && active === source) selectVisible();
    };
    const label = el("label"); label.append(box, " " + source);
    const remove = el("button", "", "Löschen"); remove.title = "Alle Telegramme dieses Reiters löschen";
    remove.onclick = () => deleteTab(source);
    const line = el("div", "col"); line.append(label, remove);
    return line;
  }));
}

// Ersten sichtbaren Reiter wählen; ohne sichtbare keinen
function selectVisible() {
  const tab = [...$("tabs").children].find((t) => !t.hidden);
  if (tab) return select(tab.dataset.source);
  for (const p of panels.values()) p.el.hidden = true;
  active = null;
}

async function deleteTab(source) {
  if (!confirm(`Alle Telegramme von „${source}“ endgültig löschen?`)) return;
  const res = await fetch("/api/sources?" + new URLSearchParams({ source }), { method: "DELETE" });
  if (res.status === 401) return showLogin();
  if (!res.ok) return alert(await res.text());
  const p = panels.get(source);
  p.el.remove(); p.tab.remove(); panels.delete(source);
  hiddenTabs = hiddenTabs.filter((s) => s !== source);
  save("boslook.hiddenTabs", hiddenTabs);
  if (active === source) selectVisible();
  $("empty").hidden = panels.size > 0;
  tabMenu();
}

function select(source) {
  for (const [s, p] of panels) {
    p.el.hidden = s !== source;
    p.tab.classList.toggle("active", s === source);
  }
  active = source;
  save("boslook.active", source);
  setUnread(panels.get(source), 0);
}

function setUnread(p, n) {
  p.unread = n;
  p.tab.querySelector(".count")?.remove();
  if (n) {
    const c = document.createElement("span");
    c.className = "count";
    c.textContent = n;
    p.tab.append(c);
  }
}

$("tabs").ondragover = (e) => {
  e.preventDefault();
  const dragging = $("tabs").querySelector(".dragging");
  const target = e.target.closest("#tabs button");
  if (!dragging || !target || target === dragging) return;
  const box = target.getBoundingClientRect();
  $("tabs").insertBefore(dragging, e.clientX < box.left + box.width / 2 ? target : target.nextSibling);
};
$("tabs").ondrop = (e) => e.preventDefault();

// Per Ziehen gespeicherte Reihenfolge zuerst, Quellen ohne gespeicherte Position alphabetisch dahinter
function tabOrder(a, b) {
  const saved = load("boslook.tabs", []);
  const pos = (s) => { const i = saved.indexOf(s); return i < 0 ? Infinity : i; };
  return pos(a) - pos(b) || a.localeCompare(b, "de", { numeric: true });
}
$("tabs-sort").onclick = () => {
  save("boslook.tabs", []);
  $("tabs").append(...[...$("tabs").children].sort((a, b) => tabOrder(a.dataset.source, b.dataset.source)));
  tabMenu();
};

// Spalten per Ziehen der Überschrift umsortieren (nicht beim Ziehen der Breite am Rand)
let dragCol = null, resizing = false;
$("panels").ondragstart = (e) => {
  const th = e.target.closest?.("th[draggable]");
  if (!th) return;
  if (resizing) return e.preventDefault();
  dragCol = th.dataset.col;
  e.dataTransfer.setData("text/plain", dragCol);
};
$("panels").ondragend = () => { dragCol = null; };
$("panels").ondragover = (e) => { if (dragCol && e.target.closest("th")) e.preventDefault(); };
$("panels").ondrop = (e) => {
  const th = e.target.closest("th");
  if (!dragCol || !th || th.dataset.col === dragCol) return;
  e.preventDefault();
  const box = th.getBoundingClientRect();
  const keys = ordered().map((c) => c.key);
  const before = e.clientX < box.left + box.width / 2 ? th.dataset.col : keys[keys.indexOf(th.dataset.col) + 1] ?? null;
  if (before !== dragCol) moveColumn(dragCol, before);
};

// Spaltenbreiten per Ziehen am rechten Rand der Überschrift; gelten für alle Reiter in diesem Browser
const widths = load("boslook.widths", {});
// Bis 0.1.4 waren die Breiten nach Spaltennummer gespeichert
["time", "kind", "address", "sub"].forEach((key, i) => { if (widths[i]) { widths[key] ??= widths[i]; delete widths[i]; } });
function applyWidths() {
  for (const p of panels.values()) {
    const fixed = [];
    for (const grip of p.el.querySelectorAll(".grip")) {
      if (widths[grip.dataset.col]) grip.parentElement.style.width = widths[grip.dataset.col] + "px";
      fixed.push(grip.parentElement.style.width);
    }
    if (!hidden.includes("message")) fixed.push("16rem");
    p.el.querySelector("table").style.minWidth = `calc(${fixed.join(" + ") || "0px"})`;
  }
}
$("panels").onpointerdown = (e) => {
  const grip = e.target.closest(".grip");
  if (!grip) return;
  e.preventDefault();
  resizing = true;
  grip.setPointerCapture(e.pointerId);
  const offset = e.clientX - grip.parentElement.offsetWidth;
  grip.onpointermove = (e) => {
    widths[grip.dataset.col] = Math.max(40, e.clientX - offset);
    applyWidths();
  };
  grip.onpointerup = () => {
    grip.onpointermove = null;
    resizing = false;
    save("boslook.widths", widths);
  };
};

async function loadOlder(source) {
  const p = panel(source);
  const query = new URLSearchParams({ source, limit: 100 });
  if (p.oldest) query.set("before", p.oldest);
  const res = await fetch("/api/telegrams?" + query);
  if (res.status === 401) return showLogin();
  const list = await res.json();
  for (const t of list) p.rows.append(row(t, false));
  if (list.length) p.oldest = list[list.length - 1].id;
  p.more.hidden = list.length < 100;
}

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  socket = new WebSocket(proto + "//" + location.host + "/api/live");
  socket.onopen = () => { $("status").className = "on"; $("status").textContent = "live"; };
  socket.onmessage = (e) => {
    const t = JSON.parse(e.data);
    const p = panel(t.source);
    // Gleiche ID: bessere Fassung vom Doppelfilter, ersetzt die Zeile
    const old = t.id && [...p.rows.children].find((tr) => tr.telegram.id === t.id);
    if (old) return old.replaceWith(row(t, false));
    p.rows.prepend(row(t, true));
    if (t.source !== active) setUnread(p, p.unread + 1);
  };
  socket.onclose = () => {
    $("status").className = "off"; $("status").textContent = "getrennt";
    if (!$("app").hidden) setTimeout(connect, 3000);
  };
}

function showLogin() {
  $("app").hidden = true; $("login").hidden = false;
  if (socket) socket.close();
}

async function showApp() {
  $("login").hidden = true; $("app").hidden = false;
  showSettings(false);
  $("panels").innerHTML = ""; $("tabs").innerHTML = "";
  panels.clear(); active = null; $("empty").hidden = false;
  tabMenu();
  wanted = load("boslook.active", null);
  const res = await fetch("/api/sources");
  if (res.status === 401) return showLogin();
  const sources = await res.json();
  fetch("/api/me").then((r) => r.json()).then((m) => { $("version").textContent = m.version; });
  loadUpdate();
  pluginPages();
  for (const s of sources) panel(s);
  await Promise.all(sources.map(loadOlder));
  connect();
}

$("login").onsubmit = async (e) => {
  e.preventDefault();
  $("error").textContent = "";
  const res = await fetch("/api/login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user: $("user").value, password: $("password").value }),
  });
  if (res.ok) { $("password").value = ""; showApp(); }
  else $("error").textContent = "Benutzer oder Passwort falsch";
};
function showSettings(on) {
  $("settings").hidden = !on; $("telegrams").hidden = on;
  $("settings-btn").hidden = on;
}

// Die Konfiguration wird im Formular bearbeitet, als Rückfallebene auch als Text
let textMode = false;
let cfg = null; // { schema, values, devices }
let dirty = false;
$("settings").addEventListener("input", () => { dirty = true; });
$("settings").addEventListener("change", () => { dirty = true; });

async function loadConfig() {
  const res = await fetch(textMode ? "/api/config" : "/api/config/form");
  if (res.status === 401) return showLogin();
  if (!res.ok) { showMsg(await res.text(), true); return; }
  if (textMode) $("config").value = await res.text();
  else { cfg = await res.json(); renderForm(); }
  $("cfg-form").hidden = textMode; $("config").hidden = !textMode;
  dirty = false;
  $("mode").textContent = textMode ? "Als Formular bearbeiten" : "Als Text bearbeiten";
}
function showMsg(text, error) {
  $("settings-msg").textContent = text; $("settings-msg").className = error ? "err" : "";
}

$("settings-btn").onclick = async () => {
  showMsg("");
  await loadConfig();
  showSettings(true);
};
$("settings-back").onclick = () => showSettings(false);
$("mode").onclick = () => {
  if (dirty && !confirm("Ungespeicherte Änderungen gehen beim Umschalten verloren. Umschalten?")) return;
  textMode = !textMode; showMsg(""); loadConfig();
};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

// Neuer Eintrag mit Standardwerten; Auswahlfelder ohne Standard nehmen den ersten Wert
function newItem(list) {
  const item = {};
  for (const f of list) {
    if (f.default !== null) item[f.key] = structuredClone(f.default);
    else if (f.required && f.input.type === "select") item[f.key] = f.input.options[0];
  }
  return item;
}

function renderForm() {
  dirty = true;
  const scroll = scrollY;
  $("cfg-form").replaceChildren(...cfg.schema.map(section));
  scrollTo(0, scroll);
}

// Aufgeklappte Abschnitte; alle anderen sind zu, auch nach dem Neuzeichnen
const openSections = new Set();
// Betrifft die Fehlermeldung beim Speichern diesen Abschnitt? (wie boslook::form::mentions)
const mentions = (msg, title) => title && [":", " '", " Nr. "].some((after) => msg.includes(title + after));

function section(s) {
  const v = cfg.values;
  const box = el("details", "section");
  box.open = openSections.has(s.key);
  box.ontoggle = () => { if (box.open) openSections.add(s.key); else openSections.delete(s.key); };
  box.append(el("summary", "", s.title));
  if (s.help) box.append(el("p", "help", s.help));
  if (s.kind === "root") box.append(...fields(s.fields, v));
  else if (s.kind === "table") box.append(...fields(s.fields, v[s.key] ??= newItem(s.fields)));
  else if (s.kind === "optional") {
    const on = el("input"); on.type = "checkbox"; on.checked = v[s.key] != null;
    on.onchange = () => { v[s.key] = on.checked ? newItem(s.fields) : null; renderForm(); };
    const label = el("label", "checks"); label.append(on, "aktiv");
    box.append(label);
    if (v[s.key] != null) box.append(...fields(s.fields, v[s.key]));
  } else {
    const list = v[s.key] ??= [];
    list.forEach((item, i) => {
      const div = el("div", "item");
      const remove = el("button", "", "Entfernen"); remove.type = "button";
      remove.onclick = () => { list.splice(i, 1); renderForm(); };
      div.append(...fields(s.fields, item), remove);
      box.append(div);
    });
    const add = el("button", "", "+ Hinzufügen"); add.type = "button";
    add.onclick = () => { list.push(newItem(s.fields)); renderForm(); };
    box.append(add);
    if (s.key === "rewrite") box.append(rewriteTest(s));
  }
  return box;
}

// Testfeld unter den Bearbeitungsregeln; die Regeln kommen ungespeichert aus dem Formular
const testValues = { kind: "pocsag", source: "", address: "", sub: "a", message: "" };
function rewriteTest(s) {
  const row = el("div", "row");
  const controls = el("div", "test");
  const result = el("small", "test-result");
  const kind = el("select");
  for (const k of s.fields.find((f) => f.key === "kind").input.options) kind.append(new Option(k.toUpperCase(), k, false, k === testValues.kind));
  const source = el("input", "source"); source.placeholder = "Kanal"; source.value = testValues.source;
  const address = el("input"); address.placeholder = "Adresse"; address.value = testValues.address;
  const sub = el("select");
  for (const x of ["a", "b", "c", "d"]) sub.append(new Option(x, x, false, x === testValues.sub));
  const message = el("input", "message"); message.placeholder = "Meldung"; message.value = testValues.message;
  const button = el("button", "", "Testen"); button.type = "button";
  let timer = null;
  const run = async () => {
    Object.assign(testValues, { kind: kind.value, source: source.value, address: address.value, sub: sub.value, message: message.value });
    if (!address.value.trim()) return (result.textContent = "");
    const res = await fetch("/api/rewrite/test", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ rules: cfg.values.rewrite ?? [], ...testValues }) });
    if (!res.ok) { result.className = "test-result err"; result.textContent = await res.text(); return; }
    const { telegram: t, applied } = await res.json();
    const described = [t.ort, t.kurz, t.lang].filter(Boolean).join(" · ");
    result.className = "test-result";
    result.textContent = `→ ${t.address}${t.sub}: ${t.message}` + (described ? `\n${described}` : "") + `\n${applied ? "Regeln: " + applied : "Keine Regel passt"}`;
  };
  for (const e of [kind, sub]) e.onchange = run;
  for (const e of [source, address, message]) e.oninput = () => { clearTimeout(timer); timer = setTimeout(run, 300); };
  button.onclick = run;
  controls.append(source, kind, address, sub, message, button);
  row.append(el("span", "", "Telegramm testen"), controls, result);
  if (testValues.address) run();
  return row;
}

function fields(list, obj) {
  return list.filter((f) => !f.when || f.when[1].includes(obj[f.when[0]])).map((f) => {
    // Mehrfachauswahl nicht in ein <label>, sonst schaltet ein Klick auf den Namen das erste Kästchen
    const row = el(["choices", "names", "pairs", "group"].includes(f.input.type) ? "div" : "label", "row");
    const name = el("span", "", f.label);
    if (f.required) name.append(el("span", "req", " *"));
    row.append(name, input(f, obj));
    if (f.help) row.append(el("small", "", f.help));
    return row;
  });
}

function input(f, obj) {
  const type = f.input.type, value = obj[f.key];
  const set = (v) => { obj[f.key] = v; };
  if (type === "bool") {
    const e = el("input"); e.type = "checkbox"; e.checked = !!value;
    e.onchange = () => set(e.checked);
    const wrap = el("span", "checks"); wrap.append(e);
    return wrap;
  }
  if (type === "select" || type === "device") {
    const e = el("select");
    let options = type === "device"
      ? [["", "Standardgerät"], ...cfg.devices.map((d) => [d.id, d.id + " – " + d.label.replace("\t", ", ")])]
      : f.input.options.map((o) => [o, o]);
    if (type === "select" && !f.required && f.default === null) options.unshift(["", "–"]);
    if (value && !options.some(([o]) => o === value)) options.push([value, value]);
    for (const [o, text] of options) e.append(new Option(text, o, false, o === (value ?? "")));
    // Andere Felder hängen evtl. von der Auswahl ab (z. B. Typ des Eingangs)
    e.onchange = () => { set(e.value); renderForm(); };
    return e;
  }
  if (type === "choices" || type === "names") {
    const options = type === "names" ? (cfg.values[f.input.options] ?? []).map((n) => n.name).filter(Boolean) : [...f.input.options];
    for (const v of value ?? []) if (!options.includes(v)) options.push(v);
    const wrap = el("span", "checks" + (type === "names" ? " names" : ""));
    wrap.refresh = () => wrap.replaceWith(input(f, obj));
    for (const o of options) {
      const c = el("input"); c.type = "checkbox"; c.checked = (value ?? []).includes(o);
      c.onchange = () => set(options.filter((x, i) => wrap.querySelectorAll("input")[i].checked));
      const l = el("label"); l.append(c, " " + o);
      wrap.append(l);
    }
    return wrap;
  }
  if (type === "pairs") {
    const list = obj[f.key] ??= [];
    const wrap = el("div");
    const draw = () => {
      wrap.replaceChildren(...list.map((item, i) => {
        const line = el("div", "pair");
        for (const [k, label] of f.input.options) {
          const e = el("input"); e.placeholder = label; e.value = item[k] ?? ""; e.spellcheck = false;
          e.oninput = () => { item[k] = e.value; };
          line.append(e);
        }
        const remove = el("button", "", "×"); remove.type = "button"; remove.title = "Entfernen";
        remove.onclick = () => { list.splice(i, 1); draw(); };
        line.append(remove);
        return line;
      }));
      const add = el("button", "", "+"); add.type = "button"; add.title = "Hinzufügen";
      add.onclick = () => { list.push({}); draw(); wrap.querySelectorAll("input")[list.length * f.input.options.length - f.input.options.length].focus(); };
      wrap.append(add);
    };
    draw();
    return wrap;
  }
  if (type === "group") {
    const list = obj[f.key] ??= [];
    const wrap = el("div");
    list.forEach((item, i) => {
      const div = el("div", "item");
      const remove = el("button", "", "Entfernen"); remove.type = "button";
      remove.onclick = () => { list.splice(i, 1); renderForm(); };
      div.append(...fields(f.input.options, item), remove);
      wrap.append(div);
    });
    const add = el("button", "", "+ Hinzufügen"); add.type = "button";
    add.onclick = () => { list.push(newItem(f.input.options)); renderForm(); };
    wrap.append(add);
    return wrap;
  }
  if (type === "lines" || type === "multiline") {
    const e = el("textarea"); e.rows = 3; e.value = Array.isArray(value) ? value.join("\n") : value ?? "";
    e.oninput = () => set(e.value);
    return e;
  }
  const e = el("input");
  e.value = type === "secret" ? "" : value ?? "";
  if (type === "password" || type === "secret") { e.type = "password"; e.autocomplete = "new-password"; }
  if (type === "number") e.inputMode = "numeric";
  if (type === "secret") {
    // Gespeichert ist nur der Hash: leer lassen = unverändert
    e.placeholder = typeof value === "string" ? "unverändert" : "neu festlegen";
    const old = typeof value === "string" ? value : null;
    e.oninput = () => set(e.value ? { new: e.value } : old);
  } else e.oninput = () => {
    set(e.value);
    // Namen werden in anderen Abschnitten zur Auswahl angeboten (Ziele der Alarme)
    if (f.key === "name") for (const w of $("cfg-form").querySelectorAll(".names")) w.refresh();
  };
  return e;
}

async function saveConfig(restart) {
  const msg = $("settings-msg");
  const res = textMode
    ? await fetch("/api/config", { method: "PUT", body: $("config").value })
    : await fetch("/api/config/form", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cfg.values) });
  if (res.status === 401) return showLogin();
  if (!res.ok) {
    const text = await res.text();
    if (!textMode) {
      for (const s of cfg.schema) if (mentions(text, s.title)) openSections.add(s.key);
      renderForm();
    }
    msg.className = "err"; msg.textContent = "Nicht gespeichert: " + text;
    return;
  }
  msg.className = "";
  if (!restart) {
    // Neu laden, damit Listeneinträge und Passwort-Hashes zum gespeicherten Stand passen
    await loadConfig();
    showMsg("Gespeichert. Wirksam nach einem Neustart.");
    return;
  }
  msg.textContent = "Gespeichert, BosLook startet neu …";
  await fetch("/api/restart", { method: "POST" });
  // Sitzungen gehen beim Neustart verloren, darum danach neu anmelden
  setTimeout(() => location.reload(), 3000);
}
$("save").onclick = () => saveConfig(false);
$("save-restart").onclick = () => saveConfig(true);

$("logout").onclick = async () => { await fetch("/api/logout", { method: "POST" }); showLogin(); };

fetch("/api/me").then((r) => (r.ok ? showApp() : showLogin()));
</script>
